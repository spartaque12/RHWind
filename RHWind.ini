[DualPass]
; 1 = foliage (texture-alpha meshes) is drawn alpha-tested into the G-buffer (lit and shadowed)
;     and only its soft edges are alpha-blended in the forward pass. 0 = RenderHook's behaviour.
Enabled=1
; Alpha at or above this goes to the G-buffer, below it is blended (0.05 - 0.99)
Cutoff=0.5
; Distance (m, view depth) where the cutoff starts rising / reaches 1: more and more of the foliage is
; blended instead of alpha-tested. Distant dither below takes over from DitherStart on. FadeEnd=0 = off.
FadeStart=150
FadeEnd=350
; Alpha boost per texture mip level, keeps distant leaves from thinning out (0 = off)
MipAlphaBoost=0.25
; Distant foliage drawn dithered into the G-buffer (like UseDitheringForAlphaObjects, but only far away;
; the pattern changes every frame so TAA smooths it). This removes the grain on distant trees.
; Pixels switch over randomly between DitherStart and DitherEnd (m, view depth); beyond DitherEnd
; foliage is never blended. DitherEnd <= DitherStart = off.
DitherStart=150
DitherEnd=200
